name: Build Signed Android Release

on:
  workflow_dispatch:

jobs:
  release-android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm ci

      - name: Install Cordova CLI
        run: npm install -g cordova@12

      - name: Restore Android release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Ensure Cordova Android platform
        run: |
          cordova platform remove android || true
          cordova platform add android@15.0.0

      - name: Create release build config
        run: |
          cat > build.json <<EOF
          {
            "android": {
              "release": {
                "keystore": "release.keystore",
                "storePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                "alias": "${{ secrets.ANDROID_KEY_ALIAS }}",
                "password": "${{ secrets.ANDROID_KEY_PASSWORD }}",
                "keystoreType": "${{ secrets.ANDROID_KEYSTORE_TYPE }}"
              }
            }
          }
          EOF

      - name: Build signed Android release APK
        run: cordova build android --release --buildConfig=build.json

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctech-mobile-android-release
          path: |
            platforms/android/app/build/outputs/apk/release/*.apk

      - name: Cleanup sensitive files
        if: always()
        run: rm -f release.keystore build.json
